appId: com.opennblm.desktop
productName: opennbLM
directories:
  output: release
asar: true
files:
  - apps/desktop/dist/**/*
  - apps/renderer/dist/**/*
  - apps/preload/dist/**/*
  - packages/*/dist/**/*
  - packages/*/package.json
  - apps/desktop/package.json
  - node_modules/@opennblm/**/*
  - packages/rumik-runtime/runtime/**/*
  - packages/rumik-runtime/NOTICE.rumik.md
  - package.json
extraResources:
  - from: packaging/rumik
    to: rumik
    filter:
      - '**/*'
artifactName: opennbLM-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: opennbLM
win:
  signAndEditExecutable: false
  target:
    - nsis
  forceCodeSigning: false
mac:
  category: public.app-category.education
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: packaging/macos/entitlements.plist
  entitlementsInherit: packaging/macos/entitlements.plist
  target:
    - dmg
