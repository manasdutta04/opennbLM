appId: com.opennblm.desktop
productName: opennbLM
directories:
  output: release
asar: true
icon: packaging/icons/icon.ico
files:
  - apps/desktop/dist/**/*
  - apps/renderer/dist/**/*
  - apps/preload/dist/**/*
  - packages/*/dist/**/*
  - packages/*/package.json
  # Workspace packages are imported by bare package name from Electron's main
  # process. Map their built output into a real node_modules layout inside the
  # packaged app; pnpm's development symlinks are not portable into the ASAR.
  - from: packages/contracts
    to: node_modules/@opennblm/contracts
    filter:
      - dist/**/*
      - package.json
  - from: packages/local-services
    to: node_modules/@opennblm/local-services
    filter:
      - dist/**/*
      - package.json
  - from: packages/llm-providers
    to: node_modules/@opennblm/llm-providers
    filter:
      - dist/**/*
      - package.json
  - from: packages/engine-runtime
    to: node_modules/@opennblm/engine-runtime
    filter:
      - dist/**/*
      - package.json
  - from: packages/memory
    to: node_modules/@opennblm/memory
    filter:
      - dist/**/*
      - package.json
  - from: packages/rumik-runtime
    to: node_modules/@opennblm/rumik-runtime
    filter:
      - dist/**/*
      - package.json
  - from: packages/teaching-engine
    to: node_modules/@opennblm/teaching-engine
    filter:
      - dist/**/*
      - package.json
  - from: packages/notebook-runtime
    to: node_modules/@opennblm/notebook-runtime
    filter:
      - dist/**/*
      - package.json
  - from: node_modules/.pnpm/sql.js@1.13.0/node_modules/sql.js
    to: node_modules/sql.js
    filter:
      - package.json
      - dist/sql-wasm.js
      - dist/sql-wasm.wasm
  - from: node_modules/.pnpm/jszip@3.10.2/node_modules
    to: node_modules
  - from: node_modules/.pnpm/pdf-parse@1.1.4/node_modules
    to: node_modules
  - from: node_modules/.pnpm/readable-stream@2.3.8/node_modules
    to: node_modules
  - from: node_modules/.pnpm/lie@3.3.0/node_modules
    to: node_modules
  - from: "node_modules/.pnpm/@gradio+client@2.6.0/node_modules"
    to: node_modules
  - apps/desktop/package.json
  - apps/desktop/icon.png
  - node_modules/@opennblm/**/*
  - packages/rumik-runtime/runtime/**/*
  - packages/rumik-runtime/NOTICE.rumik.md
  - package.json
extraResources:
  - from: packaging/rumik
    to: rumik
    filter:
      - '**/*'
  - from: packaging/icons/icon.ico
    to: icons/icon.ico
  - from: packaging/icons/icon.png
    to: icons/icon.png
artifactName: opennbLM-${os}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: opennbLM
win:
  signAndEditExecutable: false
  target:
    - nsis
  forceCodeSigning: false
mac:
  category: public.app-category.education
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: packaging/macos/entitlements.plist
  entitlementsInherit: packaging/macos/entitlements.plist
  target:
    - dmg
