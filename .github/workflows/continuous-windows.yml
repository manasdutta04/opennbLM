name: Continuous Windows pre-release

# Manual only. Automatic versioned installers come from Release Windows on main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-prerelease:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-upload | Out-Null
          Get-ChildItem release -Filter *.exe | Copy-Item -Destination dist-upload/
          Get-ChildItem release -Filter *.yml | Copy-Item -Destination dist-upload/ -ErrorAction SilentlyContinue

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennbLM-windows-x64-prerelease
          path: dist-upload/*
