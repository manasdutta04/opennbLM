name: Continuous Windows pre-release

# Rebuilds a moving "latest-windows" prerelease after each main push.
# Versioned releases still come from Release Windows on v* tags.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-prerelease:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-upload | Out-Null
          Get-ChildItem release -Filter *.exe | Copy-Item -Destination dist-upload/
          Get-ChildItem release -Filter *.yml | Copy-Item -Destination dist-upload/ -ErrorAction SilentlyContinue

      - name: Publish latest-windows prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist-upload -File | ForEach-Object { $_.FullName })
          if (-not $files) { throw "No installer files in dist-upload" }
          gh release view latest-windows 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Keep the tag where it is. Retargeting it conflicts with every local clone.
            gh release upload latest-windows @files --clobber
          } else {
            gh release create latest-windows @files --title "Latest Windows (main)" --prerelease --generate-notes
          }
