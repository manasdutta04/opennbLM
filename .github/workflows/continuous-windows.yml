name: Continuous Windows pre-release

# Manual only. Automatic versioned installers come from Release Windows on main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-prerelease:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml', 'electron-builder.yml') }}
          restore-keys: |
            electron-builder-win-

      - name: Build app
        run: pnpm build

      - name: Check packaged deps
        run: node scripts/check-packaged-deps.mjs

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            pnpm exec electron-builder --config electron-builder.yml --win nsis --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "electron-builder failed (attempt $i/$max); retrying after NSIS download backoff"
            if ($i -eq $max) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (20 * $i)
          }

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-upload | Out-Null
          Get-ChildItem release -Filter *.exe | Copy-Item -Destination dist-upload/
          Get-ChildItem release -Filter *.yml | Copy-Item -Destination dist-upload/ -ErrorAction SilentlyContinue

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennbLM-windows-x64-prerelease
          path: dist-upload/*
