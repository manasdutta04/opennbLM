name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @opennblm/renderer build
      - run: pnpm --filter @opennblm/preload build
      - run: pnpm --filter @opennblm/desktop build
      - run: node scripts/check-packaged-deps.mjs
      - run: pnpm --filter @opennblm/web build
