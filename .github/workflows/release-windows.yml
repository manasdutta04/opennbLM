name: Release Windows

# Every qualifying push to main publishes a new versioned GitHub Release
# (v0.1.1, v0.1.2, …). Existing tags are never moved.

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "docs/**"
      - ".agents/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        default: false

concurrency:
  group: release-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch tags
        run: git fetch --tags --force

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Next release version
        id: meta
        run: node scripts/next-release-version.mjs

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml', 'electron-builder.yml') }}
          restore-keys: |
            electron-builder-win-

      - name: Build app
        run: pnpm build

      - name: Check packaged deps
        run: node scripts/check-packaged-deps.mjs

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            pnpm exec electron-builder --config electron-builder.yml --win nsis --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "electron-builder failed (attempt $i/$max); retrying after NSIS download backoff"
            if ($i -eq $max) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (20 * $i)
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Recurse | Select-Object FullName, Length
          New-Item -ItemType Directory -Force -Path dist-upload | Out-Null
          Get-ChildItem release -Filter *.exe | Copy-Item -Destination dist-upload/
          Get-ChildItem release -Filter *.yml | Copy-Item -Destination dist-upload/ -ErrorAction SilentlyContinue
          Get-ChildItem release -Filter *.blockmap | Copy-Item -Destination dist-upload/ -ErrorAction SilentlyContinue

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennbLM-windows-x64
          path: dist-upload/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $name = "${{ steps.meta.outputs.name }}"
          $files = @(Get-ChildItem dist-upload -File | ForEach-Object { $_.FullName })
          if (-not $tag) { throw "Release tag was not computed" }
          if (-not $files) { throw "No installer files in dist-upload" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists" }
          $extra = @()
          if ("${{ inputs.prerelease }}" -eq "true") { $extra += "--prerelease" }
          gh release create $tag @files --title $name --generate-notes --latest --target ${{ github.sha }} @extra
